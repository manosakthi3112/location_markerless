<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D Web Navigation</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/DeviceOrientationControls.js"></script>

    <!-- Leaflet CSS and JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="secure-context-warning" class="warning-banner">
        <span>⚠️ Insecure Connection (HTTP). Geolocation, camera, and compass sensors will be blocked on mobile. Please use HTTPS.</span>
        <button class="close-warning-btn" onclick="this.parentElement.style.display='none'">&times;</button>
    </div>
    <video id="camera-feed" autoplay playsinline></video>

    <!-- Destination Picker (full-screen map) -->
    <div id="destination-picker" class="picker-container">
        <div id="search-container">
            <input type="text" id="search-input" placeholder="🔍 Search or tap the map..." oninput="handleSearch()">
            <div id="search-results"></div>
        </div>
        <div id="picker-map"></div>
        <div id="picker-bottom">
            <p id="picker-instruction">📍 Tap on the map to set your destination</p>
            <p id="selected-coords"></p>
            <button id="start-nav-btn" class="primary-btn" style="display:none;" onclick="startAR()">
                🚶 Start Navigation
            </button>
        </div>
    </div>

    <div id="ui-overlay" style="display: none;">
        <!-- Top Navigation Header -->
        <div id="top-nav-panel">
            <div class="nav-icon-container">
                <span id="nav-arrow">↑</span>
            </div>
            <div class="nav-text-container">
                <h3 id="instruction">Waiting for GPS...</h3>
                <p id="distance">--</p>
            </div>
        </div>

        <!-- Middle Tools -->
        <div id="middle-tools">
            <button id="like-btn" onclick="toggleLike()">❤️ Like</button>
            <p id="current-coords"></p>
            <p id="compass-info">🧭 ---</p>
        </div>

        <!-- Bottom Sheet -->
        <div id="bottom-sheet">
            <div class="sheet-handle"></div>
            <h2 id="ar-destination-title" class="destination-title">Target Destination</h2>
            <p class="destination-subtitle">Markerless Navigation</p>
            <button class="menu-btn" style="background: #ff4757; margin-top: 10px;" onclick="stopAR()">
                End Navigation
            </button>
        </div>

        <!-- Minimap Container -->
        <div id="minimap-container">
            <div id="map"></div>
            <button id="toggle-map-btn" onclick="toggleMap()">⛶ Expand</button>
        </div>
    </div>

    <div id="container"></div>

    <script src="script.js"></script>

</body>

</html>
